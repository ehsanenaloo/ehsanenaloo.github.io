<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ehsan Enaloo</title>
<meta name="description" content="Personal site of Ehsan Enaloo. Open-source projects, including the Bookmark Scope browser extension.">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569;
    --line: #e2e8f0; --accent: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1120; --card: #111a2e; --text: #e2e8f0; --muted: #94a3b8; --line: #1e293b; --accent: #2dd4bf; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .card {
    display: flex; gap: 16px; align-items: center; padding: 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    color: inherit; text-decoration: none;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); }
  .card img { width: 56px; height: 56px; border-radius: 12px; flex: none; }
  .card strong { display: block; }
  .card span { color: var(--muted); font-size: .95rem; }
  .links { margin-top: 32px; display: flex; gap: 16px; flex-wrap: wrap; }
  .links a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Ehsan Enaloo</h1>
  <p>I build free, open-source tools that keep your data on your own computer.</p>

  <h2>Projects</h2>
  <a class="card" href="https://ehsanenaloo.github.io/Bookmark-Scope/" target="_blank" rel="noopener">
    <img src="icon.png" alt="" width="56" height="56">
    <div>
      <strong>Bookmark Scope</strong>
      <span>A browser extension to find bookmarks for the site you are on and clean up duplicates and dead links.</span>
    </div>
  </a>

  <div class="links">
    <a href="https://github.com/ehsanenaloo" target="_blank" rel="noopener">GitHub</a>
    <a href="https://buymeacoffee.com/enaloo" target="_blank" rel="noopener">Buy me a coffee</a>
  </div>
</main>
</body>
</html>
